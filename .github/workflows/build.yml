name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: claude-companion-macos
          - os: windows-latest
            artifact: claude-companion-windows
          - os: ubuntu-latest
            artifact: claude-companion-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        run: ./scripts/build.sh && cd build && zip -qry "../${{ matrix.artifact }}.zip" "Claude Companion.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            target/release/claude-companion
            target/release/claude-companion.exe
          if-no-files-found: ignore
